# Release: pushing a tag v* (git tag v1.0.0 && git push origin v1.0.0) runs GoReleaser (.goreleaser.yaml): binaries
# for Linux, Windows and macOS on the GitHub release page, and the Docker image on ghcr.io.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the release and its files
      packages: write # the image on ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tests before releasing
        run: go vet ./... && go test -count=1 ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
