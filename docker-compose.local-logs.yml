# Optional: the game server runs on the same machine. Its files are mounted read-only where the monitor reads local
# logs (LOCAL_LOGS_ROOT, /gamelogs/ by default). Put the folder in .env (LOCAL_LOGS_DIR=/opt/cod4-server/cod4), then:
#   docker compose -p cod4-monitor -f docker-compose.prod.yml -f docker-compose.local-logs.yml up -d --build
# and in the dashboard: Admin → server → "Lecture des logs : Sur cette machine", folder /gamelogs/mods/<mod>/.
services:
  monitor:
    volumes:
      - ${LOCAL_LOGS_DIR:?mets LOCAL_LOGS_DIR=dossier_du_serveur_de_jeu dans le .env}:/gamelogs:ro
